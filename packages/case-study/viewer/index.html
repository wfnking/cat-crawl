<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Case Study Library</title>
    <link rel="stylesheet" href="/viewer/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">Case Study Library</div>
        <input id="search" class="search" type="search" placeholder="Search sites or pages" />
        <div id="site-list" class="site-list"></div>
      </aside>
      <main class="content">
        <section id="empty-state" class="panel">
          <h1>Select a case study</h1>
          <p>Browse a site on the left to inspect pages, tokens, components, and copy structure.</p>
        </section>
        <section id="detail" class="hidden"></section>
      </main>
    </div>
    <script type="module" src="/viewer/app.js"></script>
  </body>
</html>
